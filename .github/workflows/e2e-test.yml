name: e2e-test

on:
  push:
    paths-ignore:
      - "**.md"
  schedule:
    # UTC の 01:00 は JST だと 10:00 。
    # 1-5 で 月曜日から金曜日
    - cron: "0 1 * * 1-5"

env:
  TEST_SIGNALING_URLS: ${{ secrets.TEST_SIGNALING_URLS }}
  TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
  TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
  OPENH264_VERSION: 2.6.0

jobs:
  e2e_test_ubuntu:
    strategy:
      matrix:
        # mediapipe が Python 3.13 以降に対応していない
        # python_version: ["3.12", "3.13", "3.14"]
        python_version: ["3.12"]
        os: ["ubuntu-22.04", "ubuntu-24.04"]
    runs-on: ${{ matrix.os}}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # libx11-dev は Ubuntu 24.04 の時に必要になる模様
      - run: |
          sudo apt-get update
          sudo apt-get -y install libva2 libdrm2 libva-dev libdrm-dev libx11-dev portaudio19-dev
      - uses: shiguredo/github-actions/.github/actions/download-openh264@main
        id: openh264
        with:
          openh264_version: ${{ env.OPENH264_VERSION }}
      - run: echo "OPENH264_PATH=${{ steps.openh264.outputs.openh264_path }}" >> $GITHUB_ENV
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - run: uv run pytest -v

  # mediapipe が Linux arm64 に wheel を提供していないため ubuntu-24.04-arm では E2E テストを実行しない

  e2e_test_macos:
    strategy:
      matrix:
        # mediapipe が Python 3.13 に対応していない
        # python_version: ["3.11", "3.12", "3.13", "3.14"]
        python_version: ["3.12"]
        # macos-13 / macos-14 は raw-player の wheel が macosx_15_0_arm64 のみのためスキップ
        os: ["macos-15", "macos-26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shiguredo/github-actions/.github/actions/download-openh264@main
        id: openh264
        with:
          openh264_version: ${{ env.OPENH264_VERSION }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - run: uv run pytest -s
        env:
          OPENH264_PATH: ${{ steps.openh264.outputs.openh264_path }}

  e2e_test_windows:
    strategy:
      matrix:
        # mediapipe が Python 3.13 に対応していない
        # python_version: ["3.12", "3.13", "3.14"]
        python_version: ["3.12"]
        os: ["windows-2025"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Python を強制的に UTF-8 で利用するおまじない
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shiguredo/github-actions/.github/actions/download-openh264@main
        id: openh264
        with:
          openh264_version: ${{ env.OPENH264_VERSION }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - run: uv run pytest -s
        env:
          OPENH264_PATH: ${{ steps.openh264.outputs.openh264_path }}

  slack_notify:
    needs: [e2e_test_ubuntu, e2e_test_macos, e2e_test_windows]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-python-sdk
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
