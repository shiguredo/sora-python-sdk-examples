[project]
name = "sora-python-sdk-examples"
version = "0.0.0"
description = "Sora Python SDK examples collection"
readme = "README.md"
authors = [{ name = "Shiguredo Inc." }]
requires-python = ">=3.12"
dependencies = [
    "sora-sdk==2025.5.0.dev7",
    "opencv-python>=4.12",
    "opencv-python-headless>=4.12",
    "sounddevice>=0.5",
    "mediapipe>=0.10.14",
    "numpy>=2.2",
    "pillow>=11.3",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "dotenv"]
lint = ["ruff", "ty"]

[tool.uv]
package = false
managed = true
python-preference = "only-managed"
default-groups = ["dev", "lint"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["examples"]
testpaths = ["tests"]
