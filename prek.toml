# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

# Python 系は uv 経由で呼び出し、uv.lock で固定したバージョンと
# pyproject.toml の設定（ruff / ty）をそのまま使う。
[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv run ruff format",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv run ruff check --fix",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "ty-check",
    name = "ty check",
    entry = "uv run ty check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    priority = 20,
  },
]
